   <!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/styleindex.css">
    <link rel="shortcut icon" href="img/logo_perfumes.png" type="image/x-icon">
    <title>Registro Perfumes GP</title>
</head>
<body>
    <main class="main-container xs_12 s_12 m_12 l_12 xl_12">
        <section class="formulario xs_12 s_12 m_12 l_6 xl_6">
            <header class="titulo">
                <h1>Registro de Usuario</h1>
            </header>
                
            <form action="home.html" method="get" class="register">
                <fieldset class="datos">
                    <label for="Nombre">Nombre</label>
                    <input class="itext xs_12 s_12 m_12 l_12 xl_12" id="Nombre" type="text" placeholder="Ingrese su nombre">

                    <label for="apellido">Apellidos</label>
                    <input class="itext xs_12 s_12 m_12 l_12 xl_12" id="apellido" type="text" placeholder="Ingrese sus apellidos">

                    <label for="Gmail">Correo Electrónico</label>
                    <input class="itext xs_12 s_12 m_12 l_12 xl_12" id="Gmail" type="email" placeholder="Ingrese su correo electrónico">

                    <label for="Pass">Contraseña</label>
                    <input class="itext xs_12 s_12 m_12 l_12 xl_12" id="Pass" type="password" placeholder="Cree una nueva contraseña">
                    <label for="confirm">Confirmar contraseña</label>
                    <input class = "itext xs_12 s_12 m_12 l_12" id="confirm" type="password" placeholder="Confirme su contraseña">
                </fieldset>

                <section class="terminos">
                    <input type="checkbox" id="check-term">
                    <label for="check-term" class="textterm">Acepto los términos y condiciones</label>
                </section> 

                <section class="registroB">
                        <input class="boton_registro xs_12 s_12 m_12 l_12 xl_12" type="submit" value="Regístrate">
                </section>
            </form>
                
            <section class="redireccionLogin">
                <p>¿Tienes una cuenta? <a href="login.html">Inicia Sesión</a></p>
            </section>
        </section>

        <article class="image l_6 xl_6">
           
        </article>
    </main>
</body> 
</html>
